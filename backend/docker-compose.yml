services:
  rusc-backend:
    build: .
    image: rusc-backend:latest
    container_name: rusc-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      LIVE_WS_ATTACH_HTTP: "1"
      API_PORT: "3000"
      TCP_PORT: "3001"
    volumes:
      - rusc-data:/app/data-vol
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  rusc-data:
